headline: "Comparative advantage: Human thinks, AI codes."
description: |
  "Thinking" in this context refers to:
  <ul>
    <li><strong>Intent and Judgment:</strong> Deciding what problem actually matters.</li>
    <li><strong>Context and Nuance:</strong> Understanding organizational politics, unspoken human needs, and real-world constraints.</li>
    <li><strong>Discernment and Truth-testing:</strong> Evaluating whether an output is genuinely good, accurate, and ethical.</li>
  </ul>
  Human should focus on directing, evaluating, and prioritizing (thinking), as <strong>human judgment</strong> is the scarce, high-leverage input that AI cannot match.
