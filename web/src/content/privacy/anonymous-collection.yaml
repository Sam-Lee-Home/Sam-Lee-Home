title: "Anonymous Visitor Information Collection"
description: >
  For every visitor to our site, there are several common pieces of information that we do collect that are stored in logs. 
  Internet Protocol (IP) address, browser type, operating system, the date and time of the visit, and the addresses to 
  which a visitor linked during a visit to our website are all recorded. We use a third-party service to collect data 
  about where visitors click on some of our pages so we can improve content placement on the Website.

  We cannot and do not associate any of this information with individual persons, distribute this information, 
  or use it in any manner other than for statistical analysis in improving our site to better serve our visitors.
order: 2