title: "Cookies"
description: >
  We do not use cookies to record any personal information.

  Cookies are used by some web applications to pass needed information from one page to the next. 
  These applications use the cookies to track the session through randomly generated ID numbers that 
  cannot be traced back to any personal or private information. Rejecting a cookie in these applications 
  will render the application useless.
order: 3